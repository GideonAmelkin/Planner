# nginx site for the Planner app on RT100. Two server blocks:
#   1. port 8080 on the raw IP  (direct fallback access)
#   2. the sslip.io hostname     (HTTPS via Let's Encrypt; required for Google OAuth)
# Both serve /var/www/planner/build and reverse-proxy /api -> 127.0.0.1:5002.
# Neither sets default_server, so the existing rea.conf on port 80 stays the catch-all.
# Install to /etc/nginx/conf.d/planner.conf. certbot --nginx adds the listen 443 ssl
# block + 80->443 redirect to the sslip.io server below at cert-issue time.

# 1. Raw-IP fallback on 8080.
server {
    listen 8080;
    server_name 70.42.223.139;

    root /var/www/planner/build;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}

# 2. sslip.io hostname (port 80; certbot upgrades this to 443 + redirect).
#    Covers OAuth callbacks at /api/calendar/{google,outlook}/callback.
server {
    listen 80;
    server_name 70-42-223-139.sslip.io;

    root /var/www/planner/build;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
