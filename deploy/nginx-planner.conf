# nginx site for the Planner app on RT100. Two server blocks:
#   1. port 8080 on the raw IP  (direct fallback access)
#   2. the sslip.io hostname     (HTTPS via Let's Encrypt; required for Google OAuth)
# Both serve /var/www/planner/build and reverse-proxy /api -> 127.0.0.1:5002.
# Neither sets default_server, so the existing rea.conf on port 80 stays the catch-all.
# Install to /etc/nginx/conf.d/planner.conf. certbot --nginx adds the listen 443 ssl
# block + 80->443 redirect to the sslip.io server below at cert-issue time; this copy
# already includes them (mirrors the live file), so installing it keeps HTTPS.

# 1. Raw-IP fallback on 8080.
server {
    listen 8080;
    server_name 70.42.223.139;

    root /var/www/planner/build;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build assets never change under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html points at the hashed JS, so it must be revalidated on every load
    # or a fresh open runs an old bundle. Covers the SPA fallback too (try_files
    # re-enters this location on its internal redirect to /index.html).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}

# 2. sslip.io hostname (port 80; certbot upgrades this to 443 + redirect).
#    Covers OAuth callbacks at /api/calendar/{google,outlook}/callback.
server {
    server_name 70-42-223-139.sslip.io;

    root /var/www/planner/build;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build assets never change under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html points at the hashed JS, so it must be revalidated on every load
    # or a fresh open runs an old bundle. Covers the SPA fallback too (try_files
    # re-enters this location on its internal redirect to /index.html).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/70-42-223-139.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/70-42-223-139.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = 70-42-223-139.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 70-42-223-139.sslip.io;
    return 404; # managed by Certbot


}
